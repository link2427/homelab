name: Set up cached Olympus Buildx
description: Use the authenticated persistent cluster builder, or a GitHub-hosted builder.
runs:
  using: composite
  steps:
    - name: Read runner builder configuration
      id: config
      shell: bash
      run: |
        printf 'endpoint=%s\n' "${OLYMPUS_BUILDKIT_ENDPOINT:-}" >> "$GITHUB_OUTPUT"
        printf 'tls=%s\n' "${OLYMPUS_BUILDKIT_TLS:-}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
      if: steps.config.outputs.endpoint != ''
      with:
        driver: remote
        endpoint: ${{ steps.config.outputs.endpoint }}
        driver-opts: |
          cacert=${{ steps.config.outputs.tls }}/ca.crt
          cert=${{ steps.config.outputs.tls }}/tls.crt
          key=${{ steps.config.outputs.tls }}/tls.key
    - uses: docker/setup-buildx-action@v3
      if: steps.config.outputs.endpoint == ''
