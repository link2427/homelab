version: 2
updates:
  - package-ecosystem: docker
    directory: /runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      runtime-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      runtime-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
