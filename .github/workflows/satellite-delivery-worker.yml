name: Verify Satellite database delivery Worker
on:
  pull_request:
    paths: ['apps/olympus/satellite-data/edge/**', '.github/workflows/satellite-delivery-worker.yml']
  push:
    branches: [main]
    paths: ['apps/olympus/satellite-data/edge/**', '.github/workflows/satellite-delivery-worker.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/olympus/satellite-data/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/olympus/satellite-data/edge/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run
