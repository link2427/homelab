name: Build and verify Coder workspaces
on:
  workflow_dispatch:
    inputs:
      publisher_only:
        description: Rebuild only the catalog publisher, preserving the tested workspace digest
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - apps/olympus/coder/runtime/**
      - apps/olympus/coder/template/**
      - apps/olympus/coder/container-forge/**
      - apps/olympus/coder/skills/**
      - apps/olympus/coder/publisher/**
      - '!apps/olympus/coder/publisher/images.json'
      - apps/olympus/coder/tests/**
      - .github/workflows/coder-workspaces.yml
permissions:
  contents: read
concurrency:
  group: coder-workspaces
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select release mode
        id: mode
        env:
          PUBLISHER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_only }}
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          data=json.loads(Path('apps/olympus/coder/publisher/images.json').read_text())
          pinned=bool(re.fullmatch(r'ghcr.io/link2427/olympus-workspace@sha256:[a-f0-9]{64}',data['workspace']))
          publisher_only=os.environ['PUBLISHER_ONLY']=='true'
          if publisher_only and not pinned:
              raise SystemExit('Publisher-only release requires a verified workspace digest')
          # Preserve the initial canary image through scheduled runs until promotion.
          hold_canary=os.environ['GITHUB_EVENT_NAME']=='schedule' and not data['promote_runtime'] and pinned
          build_runtime=not (publisher_only or hold_canary)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('build_runtime='+str(build_runtime).lower()+'\n')
          if not build_runtime:
              (Path(os.environ['RUNNER_TEMP'])/'workspace-digest').write_text(data['workspace']+'\n')
          PY
      - name: Reserve disk for the full workspace image
        if: steps.mode.outputs.build_runtime == 'true'
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [ -d "$path" ] && [ "$(realpath "$path")" = "$path" ]; then sudo rm -rf -- "$path"; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test recovery and publication behavior
        run: python -m unittest discover -s apps/olympus/coder/tests -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate both template bundles
        run: |
          python apps/olympus/coder/publisher/publish.py --bundle-dir "$RUNNER_TEMP/coder-bundles"
          for name in template container-forge; do
            terraform -chdir="$RUNNER_TEMP/coder-bundles/$name" init -backend=false -no-color
            terraform -chdir="$RUNNER_TEMP/coder-bundles/$name" validate -no-color
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build directly into the local image store
        if: steps.mode.outputs.build_runtime == 'true'
        env:
          WORKSPACE_IMAGE: ghcr.io/link2427/olympus-workspace:${{ github.sha }}-${{ github.run_number }}
        run: |
          docker build --progress=plain --build-arg TOOL_REFRESH="$GITHUB_RUN_ID" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f apps/olympus/coder/runtime/Dockerfile -t "$WORKSPACE_IMAGE" apps/olympus/coder
      - name: Verify offline startup and service recovery
        if: steps.mode.outputs.build_runtime == 'true'
        env:
          WORKSPACE_IMAGE: ghcr.io/link2427/olympus-workspace:${{ github.sha }}-${{ github.run_number }}
        run: |
          docker run -d --name coder-check --network none --cap-drop ALL --security-opt no-new-privileges \
            -e OLYMPUS_CODER_WORKSPACE=reliability-check -e OLYMPUS_CODER_OWNER=jacob-neel \
            -e OLYMPUS_CODER_AGENT=main -e OLYMPUS_CODER_WILDCARD_DOMAIN=jacob-neel.dev \
            "$WORKSPACE_IMAGE" bash -c 'python3 /opt/olympus/runtime/configure.py; python3 /opt/olympus/runtime/olympus-runtime.py init; sleep infinity'
          trap 'docker logs coder-check; docker rm -f coder-check' EXIT
          docker cp apps/olympus/coder/tests/check_services.py coder-check:/tmp/check_services.py
          docker exec coder-check python3 /tmp/check_services.py
          docker exec coder-check python3 /opt/olympus/runtime/configure-canvas.py
          for service in reasonix deepseek openhands; do
            docker exec coder-check sh -c 'kill -KILL $(olympus-services pid "$1")' sh "$service"
            docker exec coder-check python3 /tmp/check_services.py
          done
      - name: Publish verified workspace image
        if: steps.mode.outputs.build_runtime == 'true'
        env:
          WORKSPACE_IMAGE: ghcr.io/link2427/olympus-workspace:${{ github.sha }}-${{ github.run_number }}
        run: |
          docker push "$WORKSPACE_IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$WORKSPACE_IMAGE" > "$RUNNER_TEMP/workspace-digest"
      - name: Update workspace pin in the publisher bundle
        run: |
          python - "$RUNNER_TEMP/workspace-digest" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path('apps/olympus/coder/publisher/images.json')
          data=json.loads(path.read_text())
          data['workspace']=Path(sys.argv[1]).read_text().strip()
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: publisher
        with:
          context: apps/olympus/coder
          file: apps/olympus/coder/publisher/Dockerfile
          push: true
          tags: ghcr.io/link2427/coder-catalog:${{ github.sha }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Update Flux publisher image
        env:
          PUBLISHER_DIGEST: ${{ steps.publisher.outputs.digest }}
        run: |
          # A preceding queued build may have committed pins since checkout.
          # Reapply only this run's tested pins on the latest GitOps revision.
          git restore -- apps/olympus/coder/publisher/images.json
          git pull --ff-only origin main
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          images=Path('apps/olympus/coder/publisher/images.json')
          data=json.loads(images.read_text())
          data['workspace']=(Path(os.environ['RUNNER_TEMP'])/'workspace-digest').read_text().strip()
          images.write_text(json.dumps(data,indent=2)+'\n')
          path=Path('apps/olympus/coder/publisher.yaml')
          text=path.read_text()
          text,count=re.subn(r'image: (?:ghcr.io/link2427/coder-catalog@sha256:[a-f0-9]{64}|pending-validation)', 'image: ghcr.io/link2427/coder-catalog@'+os.environ['PUBLISHER_DIGEST'],text)
          assert count==1
          path.write_text(text)
          # Warm the same verified workspace on one compute node at a time.
          path=Path('infrastructure/olympus/spegel/image-prepuller.yaml')
          text=path.read_text()
          for name,key in [('universal','workspace'),('base','linux')]:
              text,count=re.subn(r'(        - name: '+name+r'\n          image: )\S+',lambda match: match[1]+data[key],text)
              assert count==1, 'Expected exactly one image cache container for '+name
          path.write_text(text)
          PY
          git config user.name 'Olympus Coder deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/olympus/coder/publisher/images.json apps/olympus/coder/publisher.yaml infrastructure/olympus/spegel/image-prepuller.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy verified Coder workspace and catalog images'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
