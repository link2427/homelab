name: Build Olympus runner image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [runner/**, .github/workflows/runner-image.yml]
permissions:
  contents: read
concurrency:
  group: runner-image
  cancel-in-progress: false
jobs:
  image:
    # Bootstrap and recovery must work when the cluster runners are unavailable.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runner
          load: true
          tags: ghcr.io/link2427/olympus-runner:${{ github.sha }}
          cache-from: type=gha,scope=olympus-runner
          cache-to: type=gha,scope=olympus-runner,mode=max
      - name: Verify installed tools
        run: |
          docker run --rm ghcr.io/link2427/olympus-runner:${{ github.sha }} bash -ec 'node --version; npm --version; python --version; cargo --version; rustfmt --version; cargo clippy --version; pwsh --version; docker --version; docker compose version; git --version; gh --version; dpkg -s libgl1-mesa-dev libwebkit2gtk-4.1-dev >/dev/null'
      - run: docker push ghcr.io/link2427/olympus-runner:${{ github.sha }}
      - name: Build matching Docker sidecar
        uses: docker/build-push-action@v6
        with:
          context: runner
          file: runner/Dockerfile.dind
          build-args: RUNNER_IMAGE=ghcr.io/link2427/olympus-runner:${{ github.sha }}
          load: true
          tags: ghcr.io/link2427/olympus-runner-dind:${{ github.sha }}
          cache-from: type=gha,scope=olympus-runner-dind
          cache-to: type=gha,scope=olympus-runner-dind,mode=max
      - name: Verify Docker sidecar and container-action mounts
        run: |
          docker run -d --privileged --name runner-dind -e DOCKER_TLS_CERTDIR= ghcr.io/link2427/olympus-runner-dind:${{ github.sha }}
          trap 'docker logs runner-dind; docker rm -f runner-dind' EXIT
          for attempt in $(seq 1 30); do
            if docker exec runner-dind docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec runner-dind docker info
          docker exec runner-dind docker run --rm -v /home/runner/externals:/__e:ro alpine:3.23.3 test -x /__e/node24/bin/node
      - run: docker push ghcr.io/link2427/olympus-runner-dind:${{ github.sha }}
      - name: Update the Flux runner image pin
        run: |
          image=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/link2427/olympus-runner:${{ github.sha }})
          dind=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/link2427/olympus-runner-dind:${{ github.sha }})
          python3 -m pip install PyYAML==6.0.2
          python3 runner/update-image.py "$image" "$dind"
          git config user.name 'Olympus runner deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infrastructure/olympus/actions/runner-defaults.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy verified Olympus runner image'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
