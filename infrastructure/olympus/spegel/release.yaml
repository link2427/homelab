apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: spegel
      version: 0.7.4
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: spegel
        namespace: spegel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: spegel-values
      valuesKey: values.yaml
