apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coder-image-cache
  labels:
    app.kubernetes.io/name: coder-image-cache
    app.kubernetes.io/part-of: spegel
spec:
  minReadySeconds: 60
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-image-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-image-cache
        app.kubernetes.io/part-of: spegel
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 5
      containers:
        - name: universal
          image: ghcr.io/link2427/olympus-workspace@sha256:1b736edff236174d3560b498cea51129f22ced4fb2449efc899116fac2074794
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM INT; while true; do sleep 3600; done
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: base
          image: codercom/example-base:ubuntu@sha256:11632124077b27ec949697f7e4b9698179998de3bf2e8c1bdfbfdef5050ae9ad
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM INT; while true; do sleep 3600; done
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coder-gpu-image-cache
  labels:
    app.kubernetes.io/name: coder-gpu-image-cache
    app.kubernetes.io/part-of: spegel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-gpu-image-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-gpu-image-cache
        app.kubernetes.io/part-of: spegel
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      terminationGracePeriodSeconds: 5
      containers:
        - name: pytorch
          image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM INT; while true; do sleep 3600; done
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
