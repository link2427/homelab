apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spegel
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - image-prepuller.yaml
configMapGenerator:
  - name: spegel-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
