apiVersion: v1
kind: Namespace
metadata:
  name: vpn-egress
  labels:
    kubernetes.io/metadata.name: vpn-egress
    # Gluetun needs NET_ADMIN and the host's /dev/net/tun device. Keep this
    # exception isolated to the shared gateway namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
