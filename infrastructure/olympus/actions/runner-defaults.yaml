apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-defaults
  namespace: actions-runners
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: arc-system
      name: arc-controller
    listenerTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        containers:
        - name: listener
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
    template:
      spec:
        automountServiceAccountToken: false
        nodeSelector:
          kubernetes.io/hostname: atlas
        terminationGracePeriodSeconds: 60
        initContainers:
        - name: dind
          image: ghcr.io/link2427/olympus-runner-dind@sha256:b849ca6e1e7533e3ffa60aa04b784c22e607fcca973e0a1c7ad4b672cea37779
          args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=123
          - --storage-driver=overlay2
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command:
              - docker
              - info
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 2Gi
              ephemeral-storage: 12Gi
          volumeMounts:
          - &id001
            name: work
            mountPath: /home/runner/_work
          - &id002
            name: dind-sock
            mountPath: /var/run
          - name: docker-data
            mountPath: /var/lib/docker
        containers:
        - name: runner
          image: ghcr.io/link2427/olympus-runner@sha256:4e8b332b7527d9b87290cb09e684c43dc07af0d6f0894a2c2951ca59ba1a4d3b
          command:
          - /home/runner/run.sh
          env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: '120'
          - name: OLYMPUS_BUILDKIT_ENDPOINT
            value: tcp://buildkit.actions-runners.svc.cluster.local:1234
          - name: OLYMPUS_BUILDKIT_TLS
            value: /etc/olympus/buildkit
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
            limits:
              cpu: '8'
              memory: 6Gi
              ephemeral-storage: 12Gi
          volumeMounts:
          - *id001
          - *id002
          - name: buildkit-tls
            mountPath: /etc/olympus/buildkit
            readOnly: true
        volumes:
        - name: work
          emptyDir:
            sizeLimit: 12Gi
        - name: dind-sock
          emptyDir: {}
        - name: docker-data
          emptyDir:
            sizeLimit: 12Gi
        - name: buildkit-tls
          secret:
            secretName: buildkit-client-tls
    scaleSetLabels:
    - olympus-linux
