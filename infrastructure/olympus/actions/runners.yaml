    namespace: arc-system
  values:
    githubConfigUrl: https://github.com/Telchar-Dynamics
    githubConfigSecret: github-telchar-dynamics
    runnerScaleSetName: olympus-telchar
    runnerGroup: Olympus trusted
  valuesFrom:
  - kind: ConfigMap
    name: runner-defaults
---
