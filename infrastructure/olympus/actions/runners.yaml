apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: arc-runners
  namespace: actions-runners
spec:
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ref:
    tag: 0.14.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-cosmotrak
  namespace: actions-runners
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: arc-runners
  dependsOn:
  - name: arc-controller
    namespace: arc-system
  values:
    githubConfigUrl: https://github.com/link2427/Cosmotrak-Website
    githubConfigSecret: github-link2427
    runnerScaleSetName: olympus-cosmotrak
  valuesFrom:
  - kind: ConfigMap
    name: runner-defaults
---
