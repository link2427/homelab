apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-fast
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "480"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: fast
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-resilient
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "480"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-bulk
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "480"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  diskSelector: bulk
---
# Longhorn creates this non-default class for binding restored/static volumes.
# Manage it here so deleting a claim never silently deletes the restored volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-static
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  staleReplicaTimeout: "30"
