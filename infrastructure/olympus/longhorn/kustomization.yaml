apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - storageclasses.yaml
  - ui-service.yaml
configMapGenerator:
  - name: longhorn-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
