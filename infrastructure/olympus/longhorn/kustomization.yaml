apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - r2-credentials.secret.yaml
  - storageclasses.yaml
  - coder-recurring-jobs.yaml
  - identity-recurring-job.yaml
  - netbox-recurring-jobs.yaml
  - ui-service.yaml
configMapGenerator:
  - name: longhorn-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
