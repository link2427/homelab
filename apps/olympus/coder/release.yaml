apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
  namespace: coder
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: coder
      version: 2.35.3
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: coder-v2
        namespace: coder
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: coder-values
      valuesKey: values.yaml
