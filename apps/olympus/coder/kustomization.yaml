apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coder
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - coder-secrets.secret.yaml
  - database.yaml
  - canary-home.yaml
  - publisher-credentials.secret.yaml
  - publisher.yaml
configMapGenerator:
  - name: coder-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
