apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-data-status
  namespace: satellite-data-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: satellite-data-status
      app.kubernetes.io/part-of: satellite-data
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
      - name: satellite-data-registry
      containers:
      - name: status
        image: ghcr.io/link2427/satellite-data-api@sha256:28ae551b303435aedb95c304606e5e9ab748c504d1553baa8d9e3ac642b26464
        command:
        - /usr/bin/tini
        - -g
        - --
        - dotnet
        - /app/SatelliteDataApi.dll
        env:
        - name: SATDATA_STATUS_ONLY
          value: 'true'
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: Publisher__Environment
          value: dev
        - name: Publisher__StatusFile
          value: /data/dev/status.json
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: temporary
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: satellite-data
      - name: temporary
        emptyDir:
          sizeLimit: 256Mi
