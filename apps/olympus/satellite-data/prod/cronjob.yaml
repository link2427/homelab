apiVersion: batch/v1
kind: CronJob
metadata:
  name: satellite-data-publisher
  namespace: satellite-data-prod
spec:
  suspend: true
  schedule: 7-59/15 * * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 6000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: satellite-data-publisher
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            fsGroup: 1654
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
          - name: satellite-data-registry
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: satellite-data-status
                    app.kubernetes.io/part-of: satellite-data
                topologyKey: kubernetes.io/hostname
          containers:
          - name: publisher
            image: ghcr.io/link2427/satellite-data-api@sha256:8c0de5cd469ded4dbaccd551e4dce5d5a69c083efe063484f4e207334a535182
            args:
            - /config/publisher.json
            - --publish
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 128Mi
              limits:
                cpu: '2'
                memory: 2Gi
                ephemeral-storage: 512Mi
            volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: credentials
              mountPath: /run/secrets/s3
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: modern-credentials
              mountPath: /run/secrets/r2
              readOnly: true
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: satellite-data
          - name: config
            configMap:
              name: satellite-data-publisher
          - name: credentials
            secret:
              secretName: satellite-data-s3
              defaultMode: 288
          - name: temporary
            emptyDir:
              sizeLimit: 256Mi
          - name: modern-credentials
            secret:
              secretName: satellite-data-r2
              defaultMode: 288
