apiVersion: batch/v1
kind: Job
metadata:
  name: satellite-timeout-review-20260911
  namespace: satellite-data-prod
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satellite-data-publisher
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
      - name: satellite-data-registry
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: satellite-data-status
                app.kubernetes.io/part-of: satellite-data
            topologyKey: kubernetes.io/hostname
      containers:
      - name: review
        image: ghcr.io/link2427/satellite-data-api@sha256:20647983a002f00898491791296be5ee000078c4bc3de7d9be7b930f40f259a7
        args:
        - --root
        - /data/prod
        - --expected-attempt
        - '2026-09-10T05:07:01.225776+00:00'
        - --not-before
        - '2026-09-11T04:36:38+00:00'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: temporary
          mountPath: /tmp
        command:
        - python3
        - /app/scripts/review_timeout_recovery.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: satellite-data
      - name: temporary
        emptyDir:
          sizeLimit: 256Mi
