apiVersion: apps/v1
kind: Deployment
metadata:
  name: lithobrake-site
  namespace: lithobrake-site
  labels:
    app.kubernetes.io/name: lithobrake-site
spec:
  # Static files only: replicas are interchangeable.
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: lithobrake-site
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lithobrake-site
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lithobrake-site
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: ghcr.io/link2427/lithobrake-site@sha256:1377f9bda10ff73d98f0ac8d5d2ce2237503d02b3b1a6e19e6971d1d44524592
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lithobrake-site
  namespace: lithobrake-site
  labels:
    app.kubernetes.io/name: lithobrake-site
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lithobrake-site
  ports:
    - name: http
      port: 80
      targetPort: http
