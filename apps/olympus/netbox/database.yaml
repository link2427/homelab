apiVersion: v1
kind: Service
metadata:
  name: netbox-postgres
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/part-of: netbox
spec:
  selector:
    app.kubernetes.io/name: netbox-postgres
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbox-postgres
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/part-of: netbox
spec:
  serviceName: netbox-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-postgres
        app.kubernetes.io/part-of: netbox
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.9-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: netbox
            - name: POSTGRES_USER
              value: netbox
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: postgresql-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [pg_isready, -U, netbox, -d, netbox]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, netbox, -d, netbox]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, netbox, -d, netbox]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: netbox-postgres
          app.kubernetes.io/part-of: netbox
          recurring-job.longhorn.io/source: enabled
          recurring-job.longhorn.io/netbox-db-backup: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-resilient
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-postgres
  namespace: netbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netbox-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
