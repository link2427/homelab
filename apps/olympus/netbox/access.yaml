apiVersion: v1
kind: Service
metadata:
  name: netbox-tailscale
  namespace: netbox
  annotations:
    tailscale.com/hostname: olympus-netbox
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: netbox
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: netbox
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
