apiVersion: apps/v1
kind: Deployment
metadata:
  name: shaderweave-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shaderweave-api
  template:
    metadata:
      annotations:
        shaderweave.com/billing-config-revision: '2026-09-07-1'
      labels:
        app.kubernetes.io/name: shaderweave-api
        app.kubernetes.io/part-of: shaderweave
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: shaderweave-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/link2427/shaderweave-api@sha256:ca156b64c0d8b49045fda31671f4fac09333f255c09ac09a5c2d379dda212044
          ports:
            - name: http
              containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: shaderweave-config
            - secretRef:
                name: shaderweave-env
          env:
            - name: RENDER_WORKERS
              value: '2'
            - name: JOB_CONCURRENCY
              value: '1'
            - name: JOB_RETENTION_DAYS
              value: '7'
            - name: JOB_RESULTS_MAX_BYTES
              value: '5368709120'
            - name: CACHE_MAX_BYTES
              value: '536870912'
            - name: NODE_OPTIONS
              value: --max-old-space-size=2048
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 3Gi
          startupProbe:
            httpGet: { path: /v1/ready, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /v1/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: results, mountPath: /results }
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: shaderweave-data }
        - name: results
          persistentVolumeClaim: { claimName: shaderweave-results }
        - name: cache
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: shaderweave-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shaderweave-api
  ports:
    - { name: http, port: 3001, targetPort: http }
