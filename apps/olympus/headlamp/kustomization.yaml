apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - access.yaml
configMapGenerator:
  - name: headlamp-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true

