Listen 8080
ServerName partdb.jacob-neel.dev
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^partdb\.jacob-neel\.dev$ [NC]
    RewriteCond %{HTTP:X-Forwarded-Proto} !^https$ [NC]
    RewriteRule ^ https://partdb.jacob-neel.dev%{REQUEST_URI} [R=308,L]
    # OneLogin's initial redirect reads CGI variables before its proxy mode is set.
    ProxyFCGISetEnvIf "req('Host') == 'partdb.jacob-neel.dev' && req('X-Forwarded-Proto') == 'https'" HTTPS on
    ProxyFCGISetEnvIf "req('Host') == 'partdb.jacob-neel.dev' && req('X-Forwarded-Proto') == 'https'" SERVER_PORT 443
    <Directory /var/www/html/public>
        AllowOverride All
    </Directory>
    <Directory /var/www/html/public/media>
        <FilesMatch "(?i)\.(php[3-8]?|phar|phtml|pht|phps)$">
            Require all denied
        </FilesMatch>
    </Directory>
    # MCP is available only through the private tailnet hostname.
    <LocationMatch "^/mcp(?:/|$)">
        Require expr "%{HTTP_HOST} =~ /^olympus-partdb(?:\.taild90e78\.ts\.net)?(?::80)?$/"
    </LocationMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
