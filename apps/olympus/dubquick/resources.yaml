apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubquick
spec:
  # ponytail: one process owns SQLite/jobs; add a durable queue before replicas.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dubquick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dubquick
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: atlas
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: dubquick-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replaced with a verified immutable digest by the app's release workflow.
          image: ghcr.io/link2427/dubquick@sha256:9890caa18f4f446915639bda0418f01a018817b6754b4de50f43e3a763bb1232
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: dubquick-config
            - secretRef:
                name: dubquick-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: '8'
              memory: 8Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: '32'
              memory: 24Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - {name: Host, value: dubquick.com}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - {name: Host, value: dubquick.com}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - {name: Host, value: dubquick.com}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: scratch, mountPath: /scratch}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: dubquick-state
        - name: scratch
          persistentVolumeClaim:
            claimName: dubquick-scratch
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dubquick
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dubquick
  ports:
    - name: http
      port: 80
      targetPort: http
