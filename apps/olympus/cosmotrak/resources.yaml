apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmotrak
  namespace: cosmotrak
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: cosmotrak
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosmotrak
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: ghcr.io/link2427/cosmotrak-website@sha256:f010da1b83565a3dfa6f360fab19864e40cdeb2a9580a31b6e5017c712b7667b
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: cosmotrak
  namespace: cosmotrak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cosmotrak
  ports:
    - name: http
      port: 80
      targetPort: http

