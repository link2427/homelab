apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
- homepage-media.secret.yaml
configMapGenerator:
- name: homepage
  namespace: homepage
  files:
  - config/bookmarks.yaml
  - config/custom.css
  - config/custom.js
  - config/docker.yaml
  - config/kubernetes.yaml
  - config/services.yaml
  - config/settings.yaml
  - config/widgets.yaml
