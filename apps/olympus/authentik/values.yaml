global:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

# Configuration is supplied as environment variables from the SOPS-encrypted
# Secret so no credential material is copied into Helm release history.
authentik:
  enabled: true
  existingSecret:
    secretName: authentik-secrets

blueprints:
  configMaps:
    - olympus-identity-blueprint
    - cosmotrak-notifications-blueprint

server:
  replicas: 1
  podAnnotations:
    olympus/configuration-revision: cosmotrak-notifications-20260909
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

worker:
  replicas: 1
  podAnnotations:
    olympus/configuration-revision: cosmotrak-notifications-20260909
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

postgresql:
  enabled: false

geoip:
  enabled: false
