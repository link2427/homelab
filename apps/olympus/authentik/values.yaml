global:
  # Chart 2026.5.6 is the newest 2026.5 chart; 2026.5.8 carries the MFA and
  # SAML bypass fixes (CVE-2026-94606/-94609/-94611/-94612/-94613).
  image:
    tag: "2026.5.8"
    digest: sha256:0ab5658f7f4963f2964cffe0963fa1ef2fa84c21a259489d6fdded789d82492e
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

# Configuration is supplied as environment variables from the SOPS-encrypted
# Secret so no credential material is copied into Helm release history.
authentik:
  enabled: true
  existingSecret:
    secretName: authentik-secrets

blueprints:
  configMaps:
    - olympus-identity-blueprint
    - cosmotrak-notifications-blueprint
    - partdb-blueprint

server:
  replicas: 1
  podAnnotations:
    olympus/configuration-revision: cosmotrak-notifications-20260909
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

worker:
  replicas: 1
  podAnnotations:
    olympus/configuration-revision: cosmotrak-notifications-20260909
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

postgresql:
  enabled: false

geoip:
  enabled: false
