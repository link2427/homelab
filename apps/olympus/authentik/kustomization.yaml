apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - authentik-secrets.secret.yaml
  - cloudflared-token.secret.yaml
  - database.yaml
  - cloudflared.yaml
configMapGenerator:
  - name: authentik-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true

