apiVersion: v1
kind: ConfigMap
metadata:
  name: olympus-identity-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: olympus-identity
data:
  olympus-identity.yaml: |
    version: 1
    metadata:
      name: Olympus identity and Coder SSO
      labels:
        blueprints.goauthentik.io/description: Google sign-in and restricted Coder OIDC
    entries:
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: google
        attrs:
          name: Google
          enabled: true
          promoted: true
          provider_type: google
          consumer_key: !Env GOOGLE_OAUTH_CLIENT_ID
          consumer_secret: !Env GOOGLE_OAUTH_CLIENT_SECRET
          additional_scopes: openid profile email
          user_matching_mode: email_link
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

      - model: authentik_providers_oauth2.oauth2provider
        id: coder-provider
        identifiers:
          name: Coder
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env CODER_OIDC_CLIENT_ID
          client_secret: !Env CODER_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://coder.jacob-neel.dev/api/v2/users/oidc/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: user_email
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        id: coder-application
        identifiers:
          slug: coder
        attrs:
          name: Coder
          provider: !KeyOf coder-provider
          meta_launch_url: https://coder.jacob-neel.dev
          meta_description: Olympus development workspaces
          meta_publisher: Olympus
          policy_engine_mode: all

      - model: authentik_policies_expression.expressionpolicy
        id: coder-email-policy
        identifiers:
          name: Coder - Jacob Google account only
        attrs:
          execution_logging: true
          expression: |
            return request.user.email.lower() == "jacob.neel@gmail.com"

      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          policy: !KeyOf coder-email-policy
          target: !KeyOf coder-application
        attrs:
          enabled: true
          negate: false
          timeout: 30

