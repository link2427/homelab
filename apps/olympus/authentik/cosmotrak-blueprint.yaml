apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmotrak-notifications-blueprint
  namespace: authentik
data:
  cosmotrak-notifications.yaml: |
    version: 1
    metadata:
      name: Cosmotrak notification management
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: cosmotrak-notifications-provider
        identifiers:
          name: Cosmotrak Notifications
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env COSMOTRAK_OIDC_CLIENT_ID
          client_secret: !Env COSMOTRAK_OIDC_CLIENT_SECRET
          grant_types: [authorization_code]
          redirect_uris:
            - matching_mode: strict
              url: https://manage.cosmotrak.com/auth/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: user_uuid
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: cosmotrak-notifications-application
        identifiers:
          slug: cosmotrak-notifications
        attrs:
          name: Cosmotrak Notifications
          provider: !KeyOf cosmotrak-notifications-provider
          meta_launch_url: https://manage.cosmotrak.com
          meta_description: Discovery announcements and notification delivery
          meta_publisher: Olympus
          policy_engine_mode: all
      - model: authentik_policies_expression.expressionpolicy
        id: cosmotrak-notifications-policy
        identifiers:
          name: Cosmotrak Notifications - Jacob only
        attrs:
          execution_logging: true
          expression: |
            return request.user.email.lower() == "jacob.neel@gmail.com"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          policy: !KeyOf cosmotrak-notifications-policy
          target: !KeyOf cosmotrak-notifications-application
        attrs:
          enabled: true
          negate: false
          timeout: 30
