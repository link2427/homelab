apiVersion: v1
kind: ConfigMap
metadata:
  name: partdb-blueprint
  namespace: authentik
data:
  partdb.yaml: |
    version: 1
    metadata:
      name: Olympus Part-DB SAML
    entries:
      - model: authentik_crypto.certificatekeypair
        id: partdb-sp-cert
        identifiers:
          name: Part-DB service provider
        attrs:
          certificate_data: "-----BEGIN CERTIFICATE-----\nMIIEITCCAomgAwIBAgIURZqsFmfBYpe6PYNPobX2IReQZ94wDQYJKoZIhvcNAQEL\nBQAwIDEeMBwGA1UEAwwVcGFydGRiLmphY29iLW5lZWwuZGV2MB4XDTI2MDkyNzIx\nMTEzNloXDTM2MDkyNDIxMTEzNlowIDEeMBwGA1UEAwwVcGFydGRiLmphY29iLW5l\nZWwuZGV2MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA7MDm+Ea+5uxM\nSADNq9Ua+9L5yn1g7TR7gdz7yUeOq3/mTwuIiEkPmZ8OUzBUxUzQQt5MS6R9SEA5\nGJgLwg7zrxGVc50NmyQMlVmdAGYU5nIow/2Vgc55t4cTJy9uYFl7YfiGAAxZ0lLo\n+Iwx9vOdmvyZOTIz+NsU8ZzCRopydt455CMdpP3t6nwKdISaxHbtjlrtZVCsaZzs\nzrD9tIfRE7LbMUDwzT08JxLlUKjoLUfxlp/PlM3je5VmBO8fCKPFi+kswv6/q4YR\nsmXUnSldkPkSgKCIGgxICMXboEAm9ZC8DQOZ41jOEk1OYHHYW/j90GiqM4iBYcGw\nBme7YJzWJgYd8pquAxKUqgQk9gO7JkwowfjZLlecFp148andMSrAnWjHmJ/MZjsR\nuX9iivbA3599v50wsl0bLT0sB4izmXBgfPa4o1QF7DdqTCt8gZ/5JdhwVyuhZkOy\nD0Ylrwroi/ypW88+ybq3ES3QS9blv2v4isKbk0AXfvwWf9fF+K5rAgMBAAGjUzBR\nMB0GA1UdDgQWBBQXJPg9SAAOJ5WM6X9CGQFc1aXcDTAfBgNVHSMEGDAWgBQXJPg9\nSAAOJ5WM6X9CGQFc1aXcDTAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA\nA4IBgQAD0GEf6dnBjo3rO2/FjoRx7KtptoGrVu90MOcGbjacJ/OG4MJ4K6zasZvt\nUtu4wJgtj3SrzYQjZOjZJ8C6d08iz2bh4DF4Zl55XU0+BiwnKPbGb/hBaNE1UQ3S\n2hV7F5zc0nvdMKHcquiKYaX0EIjirGShurmZytHMWuIeIYkvHhsrOOkPbQ30wV1j\nrOT7v6PEaqXLYniVYL3iUP1RdpTq795kPv6sCRyQF5ZZ/s6HQ9xb+uGmHCT7viYk\nvczKvw/75FWkP+SThd4NAsbOFlDrDwkS99kVihhWQ55E+AIAooZkR1Zp449vkih3\nAOPwoPtPWjd0FGMkkOA9IcOmFLrCq/ZmMGRRg+i7uronYbCg2AVgHDLihzTMSOmg\nOeSgINNBjaEzO/wXg0O/JoMDbZWPIuqVMrZwtrLBxmOZo1827LzxguZV+JKGH3JP\nBVcTt1o6AZcbqZEAiDyQ27qrnlTk80uMztpeid4qR7v0roagDZN8KZGecSnxYg35\nHJzRcyk=\n-----END CERTIFICATE-----\n"
      - model: authentik_providers_saml.samlpropertymapping
        id: partdb-email
        identifiers:
          name: Part-DB email
        attrs:
          saml_name: email
          expression: return request.user.email.lower()
      - model: authentik_providers_saml.samlpropertymapping
        id: partdb-group
        identifiers:
          name: Part-DB group
        attrs:
          saml_name: group
          expression: return ["partdb-admin"] if request.user.email.lower() == "jacob.neel@gmail.com" else []
      - model: authentik_providers_saml.samlprovider
        id: partdb-provider
        identifiers:
          name: Part-DB
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          acs_url: https://partdb.jacob-neel.dev/saml/acs
          audience: https://partdb.jacob-neel.dev/saml/metadata
          issuer_override: https://auth.jacob-neel.dev/application/saml/partdb/metadata/
          sp_binding: post
          sls_url: https://partdb.jacob-neel.dev/logout
          sls_binding: redirect
          signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          verification_kp: !KeyOf partdb-sp-cert
          sign_assertion: true
          sign_response: true
          sign_logout_request: true
          sign_logout_response: true
          name_id_mapping: !KeyOf partdb-email
          default_name_id_policy: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
          property_mappings:
            - !KeyOf partdb-email
            - !KeyOf partdb-group
      - model: authentik_core.application
        id: partdb-application
        identifiers:
          slug: partdb
        attrs:
          name: Part-DB
          provider: !KeyOf partdb-provider
          meta_launch_url: https://partdb.jacob-neel.dev
          meta_description: Electronics inventory and private MCP
          meta_publisher: Olympus
          policy_engine_mode: all
      - model: authentik_policies_expression.expressionpolicy
        id: partdb-policy
        identifiers:
          name: Part-DB - Jacob only
        attrs:
          execution_logging: true
          expression: return request.user.email.lower() == "jacob.neel@gmail.com"
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          policy: !KeyOf partdb-policy
          target: !KeyOf partdb-application
        attrs:
          enabled: true
          negate: false
          timeout: 30
