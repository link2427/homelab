apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: personal-website
resources:
- namespace.yaml
- resources.yaml
- database.yaml
- app.secret.yaml
- postgres.secret.yaml
- registry.secret.yaml
configMapGenerator:
- name: personal-website-db-init
  files:
  - 01-init.sql=init.sql
generatorOptions:
  disableNameSuffixHash: true
