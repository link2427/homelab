apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website
  namespace: personal-website
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-website
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-website
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
      - name: site
        image: ghcr.io/link2427/personal-website@sha256:ffb205aa110d04ff3b15bc5a90b41dd013b96b0d8588471a7d827887c99b272c
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
            ephemeral-storage: 3Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 15
          timeoutSeconds: 8
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '8080'
        - name: ORIGIN
          value: https://jacob-neel.com
        - name: ADDRESS_HEADER
          value: CF-Connecting-IP
        envFrom:
        - secretRef:
            name: personal-website-env
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      imagePullSecrets:
      - name: personal-website-registry
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: personal-website
  namespace: personal-website
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: personal-website
  ports:
  - name: http
    port: 80
    targetPort: http
