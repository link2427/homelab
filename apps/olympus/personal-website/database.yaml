apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: personal-website
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/olympus-app-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-resilient
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: personal-website-postgres
  namespace: personal-website
  labels:
    app.kubernetes.io/name: personal-website-postgres
    app.kubernetes.io/part-of: personal-website
spec:
  selector:
    app.kubernetes.io/name: personal-website-postgres
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: personal-website-postgres
  namespace: personal-website
  labels:
    app.kubernetes.io/name: personal-website-postgres
    app.kubernetes.io/part-of: personal-website
spec:
  serviceName: personal-website-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-website-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-website-postgres
        app.kubernetes.io/part-of: personal-website
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17.9-bookworm
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: POSTGRES_DB
          value: website
        - name: POSTGRES_USER
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - website
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - website
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - website
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: personal-website-postgres
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: atlas
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: personal-website-db-init
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
