kind: CronJob
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    telcharforge.com/environment: resume-demo
  name: forge-static-import
  namespace: telchar-forge
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        telcharforge.com/environment: resume-demo
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: forge-static-import
            app.kubernetes.io/part-of: telchar-forge
            telcharforge.com/environment: resume-demo
        spec:
          containers:
          - args:
            - import
            - --source
            - all
            command:
            - service
            envFrom:
            - configMapRef:
                name: forge-config
            - secretRef:
                name: forge-secrets
            image: ghcr.io/telchar-dynamics/forge-processor@sha256:ca0aa845dad36a77b144033859d2d7da1baf5494eba87382ed361b4de8b953db
            imagePullPolicy: Always
            name: static-import
            resources:
              limits:
                cpu: '2'
                memory: 2Gi
              requests:
                cpu: 250m
                memory: 512Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          nodeSelector:
            kubernetes.io/arch: amd64
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: forge
          serviceAccountName: forge
          terminationGracePeriodSeconds: 30
  schedule: 0 6 1 * *
  successfulJobsHistoryLimit: 2
  suspend: false
