  MCP_ALLOWED_HOSTS: forge-mcp,forge-mcp:8090,forge-mcp.telchar-forge.svc.cluster.local,forge-mcp.telchar-forge.svc.cluster.local:8090
  MCP_ALLOWED_ORIGINS: http://forge-api:8080,http://forge-mcp:8090
