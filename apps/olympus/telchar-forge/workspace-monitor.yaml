apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-monitor
  namespace: telchar-forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-monitor
        app.kubernetes.io/part-of: telchar-forge
      annotations:
        telcharforge.com/release-sha: d54d060271b77389dc018da34af1b1a9d96cfeec
    spec:
      serviceAccountName: forge
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: monitor
        image: ghcr.io/telchar-dynamics/forge-monitor@sha256:e1d4433ccca360924fa0253bfb12b34e559c7804d97c6089943621d5b02f0555
        envFrom:
        - configMapRef:
            name: forge-config
        - secretRef:
            name: forge-secrets
        ports:
        - name: health
          containerPort: 8093
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
