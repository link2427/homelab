apiVersion: batch/v1
kind: Job
metadata:
  name: forge-migrate-workspace-b8a2184
  namespace: telchar-forge
  annotations:
    telcharforge.com/release-sha: b8a2184430c02b325e0102ff4beacfbb2435f5f6
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-migrator
    spec:
      restartPolicy: Never
      serviceAccountName: forge
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/telchar-dynamics/forge-migrator@sha256:ed394a0227378b46944f9b6b33727424430ce3d720ceb3d6d4abcc2b366478fd
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: forge-secrets
              key: DATABASE_URL
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
