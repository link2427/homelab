apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-container-forge-provisioner
  namespace: coder-forge
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - serviceaccounts
      - services
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources:
      - deployments
      - statefulsets
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-container-forge-provisioner
  namespace: coder-forge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-container-forge-provisioner
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
