apiVersion: v1
kind: Namespace
metadata:
  name: plex
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-data2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    olympus.dev/backup-policy: never-r2
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.2
    - proto=tcp
    - ro
  nfs:
    server: 10.0.0.5
    path: /
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media-data2
  namespace: plex
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    olympus.dev/backup-policy: never-r2
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: plex-media-data2
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: plex
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    olympus.dev/backup-policy: never-r2
  labels:
    app.kubernetes.io/name: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-resilient
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: precision-7810-01
      terminationGracePeriodSeconds: 120
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:version-1.42.2.10156-f737b826c
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: VERSION
              value: docker
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
            - name: ADVERTISE_IP
              value: http://10.0.0.171:32400/
          ports:
            - name: plex
              containerPort: 32400
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "16"
              memory: 12Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /identity
              port: plex
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /identity
              port: plex
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media/DATA-2/Plex Media
              readOnly: true
            - name: transcode
              mountPath: /transcode
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: media
          persistentVolumeClaim:
            claimName: plex-media-data2
            readOnly: true
        - name: transcode
          emptyDir:
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
spec:
  selector:
    app.kubernetes.io/name: plex
  ports:
    - name: http
      port: 32400
      targetPort: plex
      protocol: TCP
  type: ClusterIP
