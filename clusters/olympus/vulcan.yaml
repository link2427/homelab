apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vulcan
  namespace: flux-system
spec:
  # Submissions remain disabled in config.json until live isolation checks pass.
  suspend: false
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  path: ./apps/olympus/vulcan
  prune: true
  wait: true
  dependsOn:
    - name: kueue
    - name: network-policy
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
