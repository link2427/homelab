apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpn-egress
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/olympus/vpn-egress
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
