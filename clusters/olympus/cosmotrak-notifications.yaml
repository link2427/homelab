apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cosmotrak-notifications
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 8m
  path: ./apps/olympus/cosmotrak-notifications
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
