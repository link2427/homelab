apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: olympus-status
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/olympus/olympus-status
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
